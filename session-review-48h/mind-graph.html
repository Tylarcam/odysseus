<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Ops Mind Graph — 48h</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1419; color: #e7ecf3; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #243044; background: #151b24; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    p.meta { font-size: 0.8rem; color: #8b9cb3; margin-top: 0.35rem; }
    #graph { width: 100%; height: calc(100vh - 72px); }
    .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; font-size: 0.75rem; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <header>
    <h1>Session Ops Mind Graph — Last 48 Hours</h1>
    <p class="meta">21 unique sessions · Jul 7–9 2026 · Odysseus gravity: archivist.ai + agent ops</p>
    <div class="legend">
      <span><span class="dot" style="background:#4cc9f0"></span>Root</span>
      <span><span class="dot" style="background:#f4a261"></span>Theme</span>
      <span><span class="dot" style="background:#90be6d"></span>Shipped</span>
      <span><span class="dot" style="background:#f9c74f"></span>Partial/Planned</span>
      <span><span class="dot" style="background:#f94144"></span>Blocked</span>
      <span><span class="dot" style="background:#9b5de5"></span>Action</span>
    </div>
  </header>
  <div id="graph"></div>
  <script>

      { id: 11, label: 'Clicky\noverlay', color: '#f4a261', font: { color: '#111' } },
      { id: 12, label: 'CMD Center\n+ CEO loop', color: '#f4a261', font: { color: '#111' } },
      { id: 13, label: 'Agent ops\nskills', color: '#f4a261', font: { color: '#111' } },
      { id: 14, label: 'Aether\nhistory', color: '#f4a261', font: { color: '#111' } },
      { id: 15, label: 'Infra\n+ misc', color: '#f4a261', font: { color: '#111' } },

      // Sessions
      { id: 101, label: 'e3cc73da\nv1.1 ship', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 102, label: '3c5a6859\nTasks A-C', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 103, label: '446eee8e\n/reopen', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 104, label: 'b6dd6b31\nquiet serve', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 105, label: '62da0c1d\nPhases 1-4', color: '#90be6d', font: { size: 11, color: '#111' } },

      { id: 111, label: 'd7eaa02f\nwire-up', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 112, label: 'abd1c962\nmodel drift', color: '#f9c74f', font: { size: 11, color: '#111' } },

      { id: 121, label: '5c859b5f\nmobile tabs', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 122, label: 'eb3d2499\nbrief race', color: '#f9c74f', font: { size: 11, color: '#111' } },

      { id: 131, label: '17dc235e\ncatalog 168', color: '#90be6d', font: { size: 11, color: '#111' } },
      { id: 132, label: 'af625849\nops skill', color: '#90be6d', font: { size: 11, color: '#111' } },

      { id: 153, label: 'e34d7acf\n/spaces', color: '#90be6d', font: { size: 11, color: '#111' } },

      // Actions (P0/P1)
      { id: 201, label: 'Restart :30001\nquiet wrapper', color: '#9b5de5', font: { size: 10, color: '#fff' }, shape: 'box' },

      { id: 206, label: 'Firecrawl\nAgent mode', color: '#9b5de5', font: { size: 10, color: '#fff' }, shape: 'box' },

    const edges = new vis.DataSet([
      { from: 0, to: 10 }, { from: 0, to: 11 }, { from: 0, to: 12 },
      { from: 0, to: 13 }, { from: 0, to: 14 }, { from: 0, to: 15 },

      { from: 10, to: 101 }, { from: 10, to: 102 }, { from: 10, to: 103 },
      { from: 10, to: 104 }, { from: 10, to: 105 },
      { from: 11, to: 111 }, { from: 11, to: 112 },
      { from: 12, to: 121 }, { from: 12, to: 122 },
      { from: 13, to: 131 }, { from: 13, to: 132 }, { from: 13, to: 133 },
      { from: 14, to: 141 },
      { from: 15, to: 151 }, { from: 15, to: 152 }, { from: 15, to: 153 },

      { from: 101, to: 201 }, { from: 104, to: 201 },
      { from: 112, to: 202 }, { from: 111, to: 202 },
      { from: 122, to: 203 },
      { from: 141, to: 204 },
      { from: 151, to: 205 },
      { from: 152, to: 206 },

    const container = document.getElementById('graph');
    const data = { nodes, edges };
    const options = {
      layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 120, nodeSpacing: 160 } },
      physics: false,
      interaction: { hover: true, tooltipDelay: 100 },
      edges: { arrows: { to: { enabled: true, scaleFactor: 0.5 } }, color: { color: '#3d4f66', highlight: '#4cc9f0' }, smooth: { type: 'cubicBezier' } },
      nodes: { borderWidth: 0, margin: 8 },
    };
    new vis.Network(container, data, options);
  </script>
</body>
</html>
